name: "APM: update dependency"

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Quitar autodependencia APM
    if: github.repository == 'venturars/delivery-workflow'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: staging

      - name: Quitar la autodependencia si existe
        env:
          DEPENDENCY_REPO: venturars/delivery-workflow
        run: |
          actual=$(python3 .github/scripts/self-release.py pin "$DEPENDENCY_REPO")
          if [[ -z "$actual" ]]; then
            echo "Este paquete no se autodepende. Nada que actualizar."
            exit 0
          fi
          python3 .github/scripts/self-release.py align "$DEPENDENCY_REPO"
          echo "Se quita $actual de dependencies.apm."

      - name: Crear o actualizar la PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: chore/update-delivery-workflow
          base: staging
          draft: true
          delete-branch: true
          commit-message: "chore: drop self-dependency from apm.yml"
          title: "Drop the delivery-workflow self-dependency"
          body: |
            Este paquete no se lista a sí mismo en `dependencies.apm`.
            Los consumidores instalan una etiqueta. En este repositorio se trabaja con `.apm/` local.
