name: Open release PR

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: release-pr-staging-to-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    name: Abrir o actualizar la PR de release
    runs-on: ubuntu-latest
    steps:
      - name: Abrir o actualizar staging → main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')

          if [[ -n "$existing" ]]; then
            echo "La PR #${existing} ya está abierta."
            exit 0
          fi

          gh pr create \
            --base main \
            --head staging \
            --title "chore: release staging" \
            --body "Esta PR contiene los cambios acumulados en \`staging\`. Al fusionarla, el workflow de release calculará la versión, creará la etiqueta y publicará la GitHub Release."
