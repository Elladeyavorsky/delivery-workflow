name: "Discord: publish notice"

on:
  workflow_run:
    workflows: ["PR: check rules", "Discord: capture confirmation"]
    types: [completed]

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/staging' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'issue_comment') &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: discord-pr-notifications
    concurrency:
      group: discord-pr-relations
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      # El ledger comenta la PR; GITHUB_TOKEN necesita permiso de escritura sobre PR.
      pull-requests: write
    steps:
      # Un PR: check rules en draft deja el job skipped y la ejecución en success: no hay aviso.
      - name: Confirm the triggering job can publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$RUN_NAME" != "PR: check rules" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name == "check-rules") | .conclusion][0] // ""')
          if [ "$conclusion" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "The check-rules job did not succeed; Discord notice skipped."
          fi
      # workflow_run apunta al commit confiable de la rama predeterminada.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.proceed == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/discord-pr-notifications
        if: steps.gate.outputs.proceed == 'true'
        with:
          github-token: ${{ github.token }}
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          cache-key: ${{ secrets.DISCORD_CACHE_KEY }}
          guild-id: ${{ vars.DISCORD_GUILD_ID }}
          channel-id: ${{ vars.DISCORD_GIT_CHANNEL_ID }}
          user-map: ${{ vars.DISCORD_USER_MAP }}
          expected-repository: venturars/delivery-workflow
          base-branch: staging
          minimum-reviewers: 1
          required-check: check-rules
          trigger-run-id: ${{ github.event.workflow_run.id }}
