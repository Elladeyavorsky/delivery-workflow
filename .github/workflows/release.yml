# Cada pull request a main y cada push a main calcula la versión solo con los commits
# desde la última etiqueta estable: ruptura -> major, feat -> minor, resto -> patch.
# Si apm.yml no contiene esa versión, el workflow la fija con un commit chore: release X.Y.Z.
# Ese commit también quita la dependencia de este repositorio: la etiqueta no puede pedir otro commit del mismo paquete.
# En una PR de fork, la persona autora debe subir ese mismo número y quitar esa dependencia a mano.
# El push del workflow usa GITHUB_TOKEN y no dispara otra ejecución: la release sale aquí.
name: "Release: publish"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  version:
    name: Comprobar la versión
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publicar: ${{ steps.publicar.outputs.publicar }}
      sha: ${{ steps.publicar.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 0

      - name: Calcular la siguiente versión
        id: calcular
        run: |
          bash .github/scripts/release-ia.sh
          echo "version=$(cat ia-version.txt)" >>"$GITHUB_OUTPUT"

      - name: Validar y fijar la versión determinista
        id: reconciliar
        env:
          VERSION: ${{ steps.calcular.outputs.version }}
          EVENTO: ${{ github.event_name }}
          ES_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          RAMA: ${{ github.head_ref }}
          RAMA_MAIN: ${{ github.ref_name }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          actual=$(sed -nE 's/^version:[[:space:]]*["'\'']?([0-9]+\.[0-9]+\.[0-9]+)["'\'']?[[:space:]]*$/\1/p' apm.yml | head -n 1)
          cambiado=no
          quito=no
          if [[ "$actual" != "$VERSION" ]]; then
            if [[ "$EVENTO" == pull_request && "$ES_FORK" == true ]]; then
              echo "Esta pull request viene de un fork. Sube version: \"$VERSION\" en apm.yml." >&2
              exit 1
            fi
            sed -i -E "0,/^version:/s/^version:.*/version: \"${VERSION}\"/" apm.yml
            cambiado=si
          fi

          # Falla si el tag ya existe o si la versión no supera la última estable.
          bash .github/scripts/release-version.sh >/dev/null

          pin=$(python3 .github/scripts/self-release.py align --check "$REPOSITORIO")
          if [[ "$pin" == changed ]]; then
            if [[ "$EVENTO" == pull_request && "$ES_FORK" == true ]]; then
              echo "Esta pull request viene de un fork. Quita ${REPOSITORIO} de dependencies.apm en apm.yml." >&2
              exit 1
            fi
            python3 .github/scripts/self-release.py align "$REPOSITORIO" >/dev/null
            cambiado=si
            quito=si
          elif [[ "$pin" != absent ]]; then
            echo "No se pudo revisar la autodependencia de apm.yml." >&2
            exit 1
          fi

          echo "cambiado=$cambiado" >>"$GITHUB_OUTPUT"
          echo "quito=$quito" >>"$GITHUB_OUTPUT"

          if [[ "$cambiado" == no ]]; then
            echo "apm.yml ya contiene la versión determinista v${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apm.yml
          git commit -m "chore: release ${VERSION}"
          if [[ "$EVENTO" == pull_request ]]; then
            git push origin "HEAD:${RAMA}"
          else
            git push origin "HEAD:${RAMA_MAIN}"
          fi

      - name: Explicar el cálculo en la PR
        if: github.event_name == 'pull_request' && steps.reconciliar.outputs.cambiado == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.calcular.outputs.version }}
          QUITO: ${{ steps.reconciliar.outputs.quito }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          {
            echo "El workflow ha calculado **v${VERSION}** de forma determinista."
            echo
            echo "**Regla:** $(cat ia-tipo.txt) — $(cat ia-motivo.txt)"
            echo
            echo "He actualizado \`version\` en \`apm.yml\` con \`chore: release ${VERSION}\`."
            if [[ "$QUITO" == si ]]; then
              echo
              echo "He quitado \`${REPOSITORIO}\` de \`dependencies.apm\` para que la etiqueta no pida otro commit del mismo paquete."
            fi
          } >comentario.md
          gh pr comment "$PR_NUMBER" --body-file comentario.md

      # En un push, HEAD es el commit que se va a publicar, incluido el chore: release
      # que este job acaba de subir. En una pull request no se publica nada.
      - name: Preparar la publicación
        id: publicar
        if: github.event_name == 'push'
        run: |
          git fetch --tags origin
          bash .github/scripts/release-version.sh >/dev/null
          echo "publicar=si" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  release:
    name: Etiqueta y release
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Crear la etiqueta y la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin
          version=$(bash .github/scripts/release-version.sh)
          destino=$(git rev-parse HEAD)

          bash .github/scripts/release-ia.sh
          {
            echo "## Resumen"
            echo
            if [[ -s ia-resumen.md ]]; then cat ia-resumen.md; else echo "Sin cambios resumibles."; fi
            echo
          } >notas.md

          # gh falla si el tag ya existe; nunca se fuerza, borra ni mueve una etiqueta.
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "La etiqueta v${version} ya existe en origin." >&2
            exit 1
          fi
          args=(release create "v${version}" --target "$destino" --title "v${version}" --notes-file notas.md)
          gh "${args[@]}"
