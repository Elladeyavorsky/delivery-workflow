# Cada pull request a main y cada push a main comprueban que la versión de apm.yml se puede publicar.
# Si no se puede (la etiqueta ya existe o es menor que la última), la IA de Groq decide si el cambio
# es major, minor o patch (si la IA falla, deciden las reglas de los commits)
# y sube la versión en apm.yml con un commit chore: release X.Y.Z.
# En una pull request lo deja en la rama y lo explica. En un push a main lo deja en main.
# Ese push usa GITHUB_TOKEN, así que no dispara otro workflow: la release sale en la misma ejecución,
# del commit cuya versión sí se puede publicar.
# Necesita el secreto GROQ_API_KEY en el repositorio.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  MODELO_IA: openai/gpt-oss-120b

jobs:
  version:
    name: Comprobar la versión
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publicar: ${{ steps.publicar.outputs.publicar }}
      sha: ${{ steps.publicar.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 0

      - name: Comprobar la versión de apm.yml
        id: comprobar
        run: |
          if bash .github/scripts/release-version.sh; then
            echo "valida=si" >> "$GITHUB_OUTPUT"
          else
            echo "valida=no" >> "$GITHUB_OUTPUT"
          fi

      # La IA no puede subir commits a una PR que viene de un fork: ahí la versión se sube a mano.
      - name: Pedir la versión a mano en las PR de un fork
        if: github.event_name == 'pull_request' && steps.comprobar.outputs.valida == 'no' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Esta pull request viene de un fork. Sube version en apm.yml con un commit chore: release X.Y.Z." >&2
          exit 1

      - name: Decidir la versión con IA
        if: steps.comprobar.outputs.valida == 'no' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash .github/scripts/release-ia.sh

      - name: Subir la versión en apm.yml
        if: steps.comprobar.outputs.valida == 'no' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.head_ref }}
          RAMA_MAIN: ${{ github.ref_name }}
        run: |
          version=$(cat ia-version.txt)
          sed -i -E "0,/^version:/s/^version:.*/version: \"${version}\"/" apm.yml
          bash .github/scripts/release-version.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apm.yml
          git commit -m "chore: release ${version}"
          if [ "$EVENTO" = "pull_request" ]; then
            git push origin "HEAD:${RAMA}"
          else
            git push origin "HEAD:${RAMA_MAIN}"
          fi

      - name: Explicar la versión en la PR
        if: github.event_name == 'pull_request' && steps.comprobar.outputs.valida == 'no' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version=$(cat ia-version.txt)
          {
            echo "🤖 Versión **${version}** elegida por $(cat ia-quien.txt): cambio **$(cat ia-tipo.txt)**."
            echo
            echo "**Motivo:** $(cat ia-motivo.txt)"
            echo
            echo "He subido \`version\` en \`apm.yml\` con el commit \`chore: release ${version}\`. Si no estás de acuerdo, cambia la versión en \`apm.yml\` antes de mergear."
          } > comentario.md
          gh pr comment "$PR_NUMBER" --body-file comentario.md

      # En un push, HEAD es el commit que se va a publicar: el que llegó a main, o el chore: release
      # que este job acaba de subir. En una pull request no se publica nada.
      - name: Preparar la publicación
        id: publicar
        if: github.event_name == 'push'
        run: |
          bash .github/scripts/release-version.sh >/dev/null
          echo "publicar=si" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Etiqueta y release
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Crear la etiqueta y la release
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          version=$(bash .github/scripts/release-version.sh)
          # GITHUB_SHA es el commit que disparó el workflow. Si este job acaba de subir
          # la versión, la etiqueta tiene que apuntar al commit nuevo, que es HEAD.
          destino=$(git rev-parse HEAD)

          # El resumen es un extra: si falla, la release se crea igual.
          bash .github/scripts/release-ia.sh || true
          ultima=$(cat ia-ultima.txt 2>/dev/null || true)
          {
            echo "## Resumen"
            echo
            if [ -s ia-resumen.md ]; then cat ia-resumen.md; else echo "Sin resumen automático."; fi
            echo
          } > notas.md

          gh release create "v${version}" \
            --target "$destino" \
            --title "v${version}" \
            --notes-file notas.md \
            --generate-notes \
            ${ultima:+--notes-start-tag "v${ultima}"}
