name: "PR: check rules"

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

permissions:
  contents: read
  pull-requests: read

# Un push nuevo a la misma pull request cancela la comprobación anterior
concurrency:
  group: pr-check-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-rules:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Comprobar la pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ASSIGNEE: ${{ github.event.pull_request.assignee != null && github.event.pull_request.assignee.login || '' }}
          # En un fork nadie sin permiso de escritura puede asignar: la regla de la persona asignada no aplica
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: node .github/scripts/review-pull-request.mjs
      # El emisor de Discord solo ve este número si la comprobación ha pasado y la base es staging.
      - name: Save PR number for Discord
        if: github.base_ref == 'staging'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-event
          printf '%s' "$PR_NUMBER" > pr-event/pr-number
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.base_ref == 'staging'
        with:
          name: discord-pr-number
          path: pr-event/pr-number
          retention-days: 1
