[project]
name = "docs-rag"
version = "0.1.0"
description = "RAG local de la documentación de las dependencias de un proyecto, servido por MCP (delivery-workflow)."
requires-python = ">=3.12"
dependencies = [
  "qdrant-client>=1.12",
  "ollama>=0.4",
  "sentence-transformers>=3.0",
  "mcp>=1.2,<2",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "zstandard>=0.23; python_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_rag"]
