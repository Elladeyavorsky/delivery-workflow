[project]
name = "docs-rag"
version = "0.1.0"
description = "RAG local de la documentación de las dependencias de un proyecto, servido por MCP (delivery-workflow)."
requires-python = "==3.15.*"
dependencies = [
  "qdrant-client>=1.12",
  "ollama>=0.4",
  "sentence-transformers>=3.0",
  "mcp>=1.2,<2",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "docutils>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_rag"]

# pyyaml (de transformers) aún no publica paquetes para Python 3.15. Sin compilador de C,
# su extensión no se puede construir: así se instala en Python puro.
[tool.uv]
extra-build-variables = { pyyaml = { PYYAML_FORCE_LIBYAML = "0" } }
