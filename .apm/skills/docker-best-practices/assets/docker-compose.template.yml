# Entorno de desarrollo de <proyecto>. El porqué está en <documentación de arquitectura>.
#   docker compose run --rm setup          instala las dependencias
#   docker compose up <servidor>           sirve <servidor> en http://localhost:<puerto>
# Cambia cada <…> por el valor real del proyecto.

x-base: &base
  build:
    context: .
    target: base
  image: <proyecto>-dev

services:
  setup:
    <<: *base
    command: bash docker/setup.sh
    volumes:
      - .:/work
      - <app>-node-modules:/work/<app>/node_modules
      - <gestor>-cache:/<gestor>-cache

  <servidor>:
    <<: *base
    working_dir: /work/<app>
    command: <comando> --host 0.0.0.0
    ports:
      - "<puerto>:<puerto>"
    volumes:
      - .:/work
      - <app>-node-modules:/work/<app>/node_modules
      - <gestor>-cache:/<gestor>-cache

  <opcional>:
    profiles: [<perfil>]
    build:
      context: .
      target: <etapa opcional>
    image: <proyecto>-dev-<opcional>
    working_dir: /work/<app>
    volumes:
      - .:/work
      - <app>-node-modules:/work/<app>/node_modules

volumes:
  <app>-node-modules:
  <gestor>-cache:
