name: delivery-workflow
version: "2.0.0"
description: Flujo de entrega para opencode, Claude Code, Cursor y Codex. De la idea a la revisión en GitHub o GitLab, con issue, rama, pull request en draft, spec en la issue y ciclo de desarrollo y tests por rondas, en español.
author: Ventura Rodríguez
repository: https://github.com/venturars/delivery-workflow
keywords: [git, github, gitlab, workflow, spec, agents, opencode, claude-code, cursor, codex]
targets: [opencode, claude, cursor, codex]
dependencies:
  mcp:
    - name: eur-lex
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@cyanheads/eur-lex-mcp-server@0.21.0"]
